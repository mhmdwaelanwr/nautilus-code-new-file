name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff pytest

      - name: Python syntax check
        run: python3 -m py_compile nautilus-code-new-file.py

      - name: Ruff lint
        run: ruff check src/ tests/ nautilus-code-new-file.py

      - name: Ruff format check
        run: ruff format --check src/ tests/ nautilus-code-new-file.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: bash -n install.sh && bash -n uninstall.sh

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck install.sh
        run: shellcheck install.sh

      - name: ShellCheck uninstall.sh
        run: shellcheck uninstall.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: pip install pytest && python3 -m pytest tests/ -v
